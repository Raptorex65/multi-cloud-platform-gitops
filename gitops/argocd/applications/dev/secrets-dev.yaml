apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: secrets-dev
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Raptorex65/multi-cloud-platform-gitops.git
    targetRevision: main
    path: gitops/apps/microservices-platform/azure/dev/secrets

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true