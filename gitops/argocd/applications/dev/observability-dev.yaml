apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-dev
  namespace: argocd

spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: observability

  sources:
  # Source 1 => Helm chart comes from external repository
  - repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 77.0.0
    helm:
      valueFiles:
        - $values/gitops/apps/observability/azure/dev/kube-prometheus-stack-values.yaml

  - repoURL: https://github.com/Raptorex65/multi-cloud-platform-gitops.git
    targetRevision: main
    ref: values

  # Source 2 => Dashboard config json utilized with kustomize
  - repoURL: https://github.com/Raptorex65/multi-cloud-platform-gitops.git
    targetRevision: main
    path: gitops/apps/observability/azure/dev/dashboards

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true