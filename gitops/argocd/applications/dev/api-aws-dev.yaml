apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-aws-dev-v2
  namespace: argocd
spec:
  destination:
    namespace: microservices-dev
    server: https://kubernetes.default.svc
  project: default
  source:
    helm:
      valueFiles:
      - values-aws-dev.yaml
    path: helm/api
    repoURL: https://github.com/Raptorex65/multi-cloud-platform-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true