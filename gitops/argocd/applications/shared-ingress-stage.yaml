apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingress-stage-v2
  namespace: argocd
spec:
  destination:
    namespace: microservices-stage
    server: https://kubernetes.default.svc
  project: default
  source:
    path: gitops/apps/microservices-platform/aws/dev/ingress
    repoURL: https://github.com/Raptorex65/multi-cloud-platform-gitops.git
    targetRevision: main
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true