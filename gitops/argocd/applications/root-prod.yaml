apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-platform-root-prod
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Raptorex65/multi-cloud-platform-gitops.git
    targetRevision: main
    path: gitops/argocd/applications/prod

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true