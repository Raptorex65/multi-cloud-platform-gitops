apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: test-secret
  namespace: microservices-dev

spec:
  refreshInterval: 1m

  secretStoreRef:
    name: azure-keyvault-store
    kind: ClusterSecretStore

  target:
    name: app-secret

  data:
    - secretKey: password
      remoteRef:
        key: test-secret