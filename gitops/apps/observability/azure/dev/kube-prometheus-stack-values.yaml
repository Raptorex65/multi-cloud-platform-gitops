crds:
  enabled: true

grafana:
  enabled: true
  adminPassword: prom-operator
  service:
    type: ClusterIP

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: observability
    datasources:
      enabled: true

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 800Mi
        cpu: 500m

alertmanager:
  enabled: true
  alertmanagerSpec:
    replicas: 1
    secrets:
      - alertmanager-slack-webhook
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: "null"
      group_by:
        - alertname
        - namespace
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 1h
      routes:
        - receiver: slack
          matchers:
            - alertname="APIHighErrorRate"
    receivers:
      - name: "null"
      - name: slack
        slack_configs:
          - api_url_file: /etc/alertmanager/secrets/alertmanager-slack-webhook/slack-webhook-url
            channel: "#multicloud-platform-gitops"
            send_resolved: true
            title: "{{ .CommonLabels.alertname }}"
            text: |
              Alert: {{ .CommonLabels.alertname }}
              Namespace: {{ .CommonLabels.namespace }}
              Severity: {{ .CommonLabels.severity }}
              Description: {{ .CommonAnnotations.description }}

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false