crds:
  enabled: true

grafana:
  enabled: true
  adminPassword: prom-operator
  service:
    type: ClusterIP

  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true

  dashboards:
    default:
      multicloud-platform-dashboard:
        json: |
          {
            "uid": "multicloud-platform-dashboard",
            "title": "Multicloud Platform Dashboard",
            "timezone": "browser",
            "schemaVersion": 39,
            "version": 1,
            "refresh": "15s",
            "panels": [
              {
                "id": 1,
                "type": "timeseries",
                "title": "API Requests/sec",
                "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum(rate(api_http_requests_total[5m]))",
                    "legendFormat": "requests/sec",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 2,
                "type": "timeseries",
                "title": "Requests by Service",
                "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum by (service) (rate(api_http_requests_total[5m]))",
                    "legendFormat": "{{service}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 3,
                "type": "timeseries",
                "title": "Requests by Route",
                "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum by (route) (rate(api_http_requests_total[5m]))",
                    "legendFormat": "{{route}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 4,
                "type": "timeseries",
                "title": "Requests by Status Code",
                "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum by (status_code) (rate(api_http_requests_total[5m]))",
                    "legendFormat": "{{status_code}}",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 5,
                "type": "stat",
                "title": "Total Requests",
                "gridPos": { "x": 0, "y": 16, "w": 8, "h": 6 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum(api_http_requests_total)",
                    "legendFormat": "total",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 6,
                "type": "stat",
                "title": "Healthy Targets",
                "gridPos": { "x": 8, "y": 16, "w": 8, "h": 6 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum(up{namespace=\"microservices-dev\"})",
                    "legendFormat": "healthy targets",
                    "refId": "A"
                  }
                ]
              },
              {
                "id": 7,
                "type": "timeseries",
                "title": "CPU Usage by Pod",
                "gridPos": { "x": 16, "y": 16, "w": 8, "h": 6 },
                "targets": [
                  {
                    "datasource": { "type": "prometheus", "uid": "prometheus" },
                    "expr": "sum by (pod) (rate(process_cpu_seconds_total[5m]))",
                    "legendFormat": "{{pod}}",
                    "refId": "A"
                  }
                ]
              }
            ]
          }

prometheus:
  prometheusSpec:
    retention: 2d
    scrapeInterval: 30s
    evaluationInterval: 30s
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    resources:
      requests:
        memory: 400Mi
        cpu: 100m
      limits:
        memory: 800Mi
        cpu: 500m

alertmanager:
  enabled: false

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: false

prometheusOperator:
  admissionWebhooks:
    enabled: false
  tls:
    enabled: false