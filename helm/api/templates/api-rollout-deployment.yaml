apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api-rollout-deploy
spec:
  replicas: {{ .Values.replicaCount }}

  strategy:
    canary:
      stableService: api-stable-service
      canaryService: api-canary-service
      trafficRouting:
        nginx:
          stableIngress: platform-ingress
      steps:
      - setWeight: 20
      - pause: { duration: 30s }
      - setWeight: 50
      - pause: { duration: 30s }
      - setWeight: 100
        
  selector:
    matchLabels:
      app: {{ include "api.fullname" . }}

  template:
    metadata:
      labels:
        app: {{ include "api.fullname" . }}
    spec:
      containers:
        - name: {{ include "api.fullname" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.targetPort }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.service.targetPort }}
            initialDelaySeconds: 5
            periodSeconds: 5